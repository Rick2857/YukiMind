[project]
name = "yuki-genie-model-converter"
version = "1.9.0"
description = "Offline GPT-SoVITS V2/V2ProPlus to Genie ONNX conversion helper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "genie-tts==2.0.2",
    "torch>=2.4,<3",
]

[project.scripts]
yuki-genie-convert = "convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["convert.py"]
