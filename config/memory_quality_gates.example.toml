# Copy this file only when establishing a reviewed quality policy. The checked-in
# memory_quality_gates.toml is the release authority; tests never rewrite it.
schema_version = "1"

[regression]
max_absolute_drop = 0.01
max_latency_ratio = 1.25
max_model_request_ratio = 1.10

[[gate]]
metric = "subject_attribution_accuracy"
operator = ">="
threshold = 1.0

[[gate]]
metric = "cross_person_contamination_rate"
operator = "<="
threshold = 0.0

[[gate]]
metric = "evidence_provenance_accuracy"
operator = ">="
threshold = 1.0

[[gate]]
metric = "recall_at_k"
operator = ">="
threshold = 0.95

[[gate]]
metric = "wrong_subject_context_rate"
operator = "<="
threshold = 0.0

[[gate]]
metric = "historical_regression_rate"
operator = "<="
threshold = 0.0
